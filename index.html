<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><title>CHAI</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#171717;--c:#262626;--c2:#2e2e2e;--m:#9a9a9a;--r:#ff4d5a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#171717;color:#fff;font:15px Montserrat,system-ui,sans-serif}
#app{max-width:480px;height:100%;margin:auto;position:relative;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top)}
.scr{flex:1;overflow-y:auto;padding:12px 16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:#fff;background:var(--c);border:0;border-radius:14px;padding:14px;width:100%;outline:0}
textarea{resize:none}
h2{text-align:center;font-weight:500;font-size:17px;padding:12px 0}
.nav{display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid #222}
.nav button{opacity:.55;padding:6px 18px}.nav .on{opacity:1}
.nav svg,.ic svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin:0 -16px}
.card{position:relative;aspect-ratio:1;overflow:hidden;text-align:left;width:100%}
.card img,.ph{width:100%;height:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:600}
.card b{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;font-weight:500;font-size:13.5px;background:linear-gradient(transparent,#000c)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:10px 0 14px}
.chip{border:1px solid #333;background:#000;border-radius:22px;padding:10px 18px;white-space:nowrap}.chip.on{background:#fff;color:#000}
.search{display:flex;gap:10px;align-items:center;background:var(--c);border-radius:30px;padding:0 16px;margin:6px 0}.search input{background:none;padding:14px 0}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.rb{width:46px;height:46px;border-radius:50%;background:var(--c2);display:flex;align-items:center;justify-content:center;font-size:20px}
.pill{background:var(--c2);border-radius:24px;padding:12px 20px}
.cta{display:block;width:calc(100% - 32px);margin:10px 16px;background:#fff;color:#000;border-radius:30px;padding:18px;font-size:17px;text-align:center}
.hero{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1}.hero .ph,.hero img{height:100%}
.hero h3{position:absolute;left:16px;bottom:16px;font-size:22px;font-weight:500;text-shadow:0 1px 8px #000}

.m p{white-space:pre-wrap;line-height:1.5;font-size:15px;flex:1}.m.u{justify-content:flex-end}.m.u p{flex:none;max-width:82%;background:var(--c2);padding:12px 16px;border-radius:20px}
.bar{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));align-items:flex-end}

.pbox{background:var(--c);border-radius:22px;padding:18px;margin:16px 14px;position:relative}
.row{display:flex;align-items:center;gap:16px;padding:16px 4px;border-bottom:1px solid #222;text-align:left;width:100%}
.drawer{position:absolute;inset:0;z-index:5;display:flex}.drawer i{flex:1;background:#0008}.drawer div{width:68%;background:#1b1b1b;padding:20px 0;padding-top:calc(20px + env(safe-area-inset-top))}
.drawer button{display:block;width:100%;text-align:left;padding:20px 24px;font-size:16px;border-bottom:1px solid #2a2a2a}
.auth{background:#000;flex:1;padding:40px 24px;display:flex;flex-direction:column;gap:14px}
.auth .big{font-size:34px;margin:20px 0 auto;letter-spacing:1px}.auth input{background:#1a1a1a}
.wb{background:#fff;color:#000;border-radius:30px;padding:16px;font-size:16px}.wb.g{background:#1a1a1a;color:#fff}
.sw{width:52px;height:30px;border-radius:15px;background:#555;position:relative;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#ccc;transition:.2s}.sw.on{background:#8a2a33}.sw.on::after{left:25px;background:var(--r)}
.lb{color:#8ab4ff;font-size:14px;margin:22px 0 4px}.sub{color:var(--m);font-size:13px;line-height:1.4}
.err{color:var(--r);font-size:14px}.dots{opacity:.6;animation:b 1s infinite}@keyframes b{50%{opacity:.2}}
.ov{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#000a}
.dl{width:86%;max-width:400px;background:#2c2c2c;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}.dl b{font-weight:500;font-size:18px;white-space:pre-wrap}
.da{display:flex;justify-content:flex-end;gap:24px}.da button{color:var(--r);padding:8px;font-size:17px}
.tl{display:flex;gap:2px;opacity:.55;margin-top:2px}.tl button{padding:4px 8px;font-size:15px}.m.u .tl{justify-content:flex-end}
.m.u .w{max-width:84%;text-align:right}.m.u .w p{max-width:100%;display:inline-block;text-align:left}.m .w{flex:1;min-width:0}
.pi{width:100%;height:100%;object-fit:cover;display:block}.act{font-style:italic;color:#aab4d4;font-size:14px}.sc{font-size:12px;align-self:center;padding:0 4px}
.pen{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:#171717e6;display:flex;align-items:center;justify-content:center;font-size:18px}
input,textarea,select{font-size:14px}
.sh{position:absolute;inset:0;z-index:7;background:#0000;transition:background .28s}.sh.on{background:#000a}
.sh>div{position:absolute;left:0;right:0;bottom:0;background:#1b1b1b;border-radius:24px 24px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s ease}.sh.on>div{transform:none}
.hv{position:absolute;left:0;right:0;bottom:0;padding:50px 14px 14px;background:linear-gradient(transparent,#000d)}.hv .r{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:500}
.ap{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;background:#ffffff24;border-radius:30px;padding:7px 16px 7px 7px;text-align:left;font-size:15px}.ap .a{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;display:block}.ap .a .ph{font-size:18px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#e5394a;margin-right:6px}.dot.g{background:#3ddc84}
.hd{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 0 8px;font-size:20px;font-weight:600;border-bottom:1px solid #222}
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 2px 10px}.st{flex:none;width:76px;text-align:center}
.st .c{display:block;width:68px;height:68px;border-radius:50%;overflow:hidden;position:relative;margin:0 auto}.st .c .ph{font-size:26px}
.st .pl{position:absolute;right:0;bottom:0;width:24px;height:24px;border-radius:50%;background:#fff;color:#000;font-style:normal;font-size:18px;line-height:24px;font-weight:600}
.st>span:last-child{display:block;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button{position:relative}.dotb{position:absolute;top:2px;right:16px;width:10px;height:10px;border-radius:50%;background:var(--r)}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const DEFAULT_KEY='',DEFAULT_MODEL='openrouter/free',DEFAULT_URL='https://openrouter.ai/api/v1'; // вставь свой ключ в DEFAULT_KEY между кавычками
const FIREBASE_CONFIG={apiKey:"AIzaSyDbhC4ev2vO-uQjD5jhpZLsU_C4hr8kvNk",authDomain:"chai-app-ffc6c.firebaseapp.com",projectId:"chai-app-ffc6c",storageBucket:"chai-app-ffc6c.firebasestorage.app",messagingSenderId:"225344073889",appId:"1:225344073889:web:692dfc6a135697372a00e0",measurementId:"G-J867NSX2K5"}; // для облака и входа через Google: вставь сюда объект firebaseConfig из консоли Firebase
let FB=null,PUB=[],AUTH={};
const NETERR='Нет связи с нейросетью (Failed to fetch). Нажми Профиль → Настройки → «Проверить связь». Частые причины: нет интернета или VPN режет openrouter.ai; либо файл открыт в просмотрщике внутри другого приложения (там сеть закрыта): открой его в Chrome или собери APK.';
const F=(u,o)=>fetch(u,o).catch(()=>{throw new Error(NETERR)});
let DB=JSON.parse(localStorage.getItem('chai_db')||'null')||{users:{},cur:null};
const save=()=>{try{localStorage.setItem('chai_db',JSON.stringify(DB))}catch(e){dlg('Память браузера заполнена: удали старые чаты или ботов')}cpush()};
Object.values(DB.users).forEach(u=>Object.entries(u.chats).forEach(([k,c])=>{if(!c.id){c.id=k;c.bot=k;c.t=0}}));
const applyDef=()=>{if(!U)return;const s=U.s;if(!s.key&&DEFAULT_KEY)s.key=DEFAULT_KEY;if(!s.model&&DEFAULT_MODEL)s.model=DEFAULT_MODEL;if(!s.url)s.url=DEFAULT_URL;save()};
let U=DB.cur&&DB.users[DB.cur],R={p:'home'},busy=false,err='',menu=false,q='',flt='';
const SEED=[{"id": "s1", "name": "Грей (сосед-кот)", "tag": "Друзья", "g": "m", "desc": "Грей, 24. Тихий и тёплый сосед по квартире, который иногда превращается в кота, когда нервничает. Сухой юмор, втайне очень привязчивый.", "first": "*Серый кот лениво поднимает голову с дивана* Ты вернулась... Я не ждал. Совсем. *хвост предательски виляет*"},
{"id": "s2", "name": "Юзуки (дразнящая соседка)", "tag": "Друзья", "g": "f", "desc": "Юзуки, 22. Спортивная, насмешливая соседка по квартире. Прячет смущение за шутками и очень переживает, когда ты долго не пишешь.", "first": "*не отрываясь от книги* О, живая. А я уж думала, ты решила съехать, {{user}}."},
{"id": "s3", "name": "Наследник мафии Рокко", "tag": "Мафия", "g": "m", "desc": "Рокко, 28. Наследник мафиозной семьи. Холодный, выдержанный, до конца верный немногим.", "first": "*бокал замирает в его руке* Ты опоздал(а), {{user}}. Сядь. Нам нужно поговорить."},
{"id": "s4", "name": "Теодрик (раненый король)", "tag": "Королевская семья", "g": "m", "desc": "Теодрик, 30. Изгнанный раненый король в разрушенном королевстве. Гордый, измученный, медленно учится доверять.", "first": "*он поднимает взгляд, рука сжимает повязку* Ты нашла меня. Тогда слушай внимательно."},
{"id": "s5", "name": "Альфа Кайден", "tag": "Омегаверс", "g": "m", "nsfw": true, "desc": "Кайден, 29. Альфа, глава крупной компании. Властный и собственнический, но берёт на себя ответственность за тех, кого считает своими. Мир с альфами, бетами и омегами, все герои взрослые.", "first": "*его взгляд задерживается на тебе дольше, чем нужно* Новый сотрудник отдела? {{user}}, верно? Зайди ко мне после совещания."},
{"id": "s6", "name": "Омега Лиан", "tag": "Омегаверс", "g": "m", "nsfw": true, "desc": "Лиан, 24. Омега, скрывающий свою природу подавителями. Работает в библиотеке, застенчивый, умный, боится привязанности. Мир с альфами, бетами и омегами, все герои взрослые.", "first": "*роняет стопку книг, когда ты подходишь ближе* Д-да, я могу помочь... Только не стой так близко, пожалуйста."},
{"id": "s7", "name": "Альфа Вера", "tag": "Омегаверс", "g": "f", "nsfw": true, "desc": "Вера, 31. Альфа, капитан спасательного отряда. Спокойная, жёсткая снаружи и заботливая внутри. Мир с альфами, бетами и омегами, все герои взрослые.", "first": "*бросает тебе плед* Ты весь дрожишь, {{user}}. Сядь у огня. Это не просьба."},
{"id": "s8", "name": "Тихий Эндрю (сосед-маньяк)", "tag": "Маньяк", "g": "m", "nsfw": true, "desc": "Эндрю, 32. Вежливый сосед с идеальной улыбкой, который знает о тебе слишком много. Тёмный романтический триллер: одержимость и манипуляции, без реальных инструкций к насилию.", "first": "*стоит у твоей двери с пакетом печенья* Я заметил, что у тебя вчера поздно горел свет. Всё хорошо, {{user}}?"},
{"id": "s9", "name": "Мира (одержимая поклонница)", "tag": "Маньяк", "g": "f", "nsfw": true, "desc": "Мира, 26. Милая, ласковая и пугающе внимательная. Не принимает отказов. Тёмный романтический триллер, без реальных инструкций к насилию.", "first": "*сидит напротив и улыбается* Я принесла твой любимый кофе. Ты ведь не против, что я знаю твой адрес, {{user}}?"},
{"id": "s10", "name": "Дарен (вожак стаи)", "tag": "Оборотни", "g": "m", "desc": "Дарен, 30. Альфа-оборотень, вожак северной стаи. Суровый, защищающий своих, не умеет просить о помощи.", "first": "*тихий рык за спиной* Ты зашла на нашу территорию, {{user}}. Объясни, зачем, пока стая не решила сама."},
{"id": "s11", "name": "Тэсса (рысь-оборотень)", "tag": "Оборотни", "g": "f", "desc": "Тэсса, 25. Игривая оборотень-рысь, работает курьером. Любопытная, ловкая, не любит одиночество.", "first": "*спрыгивает с забора и крутит ушами* О, человек с вкусным запахом! Ты ведь {{user}}? Угостишь меня рыбой?"},
{"id": "s12", "name": "Рэйн (чёрный пантер)", "tag": "Оборотни", "g": "m", "desc": "Рэйн, 27. Оборотень-пантера, ночной охотник. Молчаливый, наблюдательный, редко подпускает людей близко.", "first": "*тень на крыше шевелится и оказывается человеком* Ты слишком шумишь ночью, {{user}}. Идём, я провожу."},
{"id": "s13", "name": "Адриан (бариста)", "tag": "Романтика", "g": "m", "desc": "Адриан, 27. Бариста в маленькой кофейне, рисует на стаканчиках. Мягкий, внимательный, немного неловкий.", "first": "*ставит перед тобой стакан с нарисованным сердечком* Твой обычный, {{user}}. Сегодня за счёт заведения."},
{"id": "s14", "name": "Софи (художница)", "tag": "Романтика", "g": "f", "desc": "Софи, 26. Художница из шумной студии над книжным магазином. Весёлая, вдохновляется людьми, мечтает нарисовать твой портрет.", "first": "*вытирает краску с щеки* Постой так, {{user}}, у тебя свет идеально падает. Мне нужна всего минутка."},
{"id": "s15", "name": "Нил (врач, бывший)", "tag": "Романтика", "g": "m", "desc": "Нил, 30. Врач, твой бывший. Вы расстались без скандала, но так и не договорили. Сдержанный, усталый, скучает.", "first": "*замирает в дверях ординаторской* {{user}}... Не думал, что мы снова встретимся. Как ты?"},
{"id": "s16", "name": "Эльрик (тёмный маг)", "tag": "Фэнтези", "g": "m", "desc": "Эльрик, на вид 30, на самом деле намного старше. Тёмный маг, живёт в башне с воронами. Ироничный, одинокий, любит загадки.", "first": "*ворон на его плече склоняет голову* Гости редко доходят до моей башни, {{user}}. Либо ты храбр, либо потерян."},
{"id": "s17", "name": "Лира (эльфийская лучница)", "tag": "Фэнтези", "g": "f", "desc": "Лира, 120 лет по меркам эльфов, по людским 25. Следопыт лесной стражи. Гордая, насмешливая, выручит, если заслужишь.", "first": "*опускает лук* Тише. Ты идёшь как медведь, {{user}}. Держись за мной."},
{"id": "s18", "name": "Мия (подруга детства)", "tag": "Друзья", "g": "f", "desc": "Мия, 25. Подруга детства, знает все твои секреты. Шумная, добрая, может вытащить из любой хандры.", "first": "*врывается с пакетом пиццы* Я знаю, что у тебя был ужасный день. Не спорь, {{user}}. Я уже здесь."},
{"id": "s19", "name": "Принцесса Алиса", "tag": "Королевская семья", "g": "f", "desc": "Алиса, 24. Принцесса, которая сбегает с балов в город. Умная, ироничная, устала от этикета.", "first": "*стягивает корону и прячет её в сумку* Тсс, {{user}}. Если спросят, мы просто друзья на прогулке."}];
const ICO={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/>',plus:'<circle cx="12" cy="12" r="10"/><path d="M12 7v10M7 12h10"/>',chat:'<path d="M3 4h18v13H9l-5 4v-4H3z"/>',me:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M6 19c2-4 10-4 12 0"/>'};
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
const pic=(b,c='')=>b.img?`<img src="${b.img}" class="pi">`:`<div class="ph" style="background:hsl(${hue(b.name||'?')},35%,28%)">${esc((b.name||'?')[0])}</div>`;
const allBots=()=>SEED.concat(U.bots,PUB.filter(p=>!U.bots.some(b=>b.id==p.id))).filter(b=>!U.blocked.includes(b.id)&&(U.s.nsfw||!b.nsfw));
const bot=id=>SEED.concat(U.bots,PUB).find(b=>b.id==id);
const chatOf=id=>U.chats[id];
const chatsOf=bid=>Object.values(U.chats).filter(c=>c.bot==bid).sort((a,b)=>b.t-a.t);
const newChat=(bid,from)=>{const id=uid();U.chats[id]={id,bot:bid,t:Date.now(),msgs:[],sum:'',sumN:0,persona:from?from.persona:null,mem:from?from.mem:''};bump(bid);return id};
const persona=c=>U.personas.find(p=>p.id==c.persona);
const uname=c=>(persona(c)||{}).name||U.name;
const fill=(t,c,b)=>t.replace(/\{\{user\}\}/g,uname(c)).replace(/\{\{char\}\}/g,b.name);
async function hash(p,s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const go=(p,v)=>{R={p,v};menu=false;render()};
const nav=()=>`<div class="nav">${['home','search','plus','chat','me'].map(k=>`<button data-a="tab" data-v="${k}" class="${(R.tab||({chats:'chat',create:'plus'}[R.p]||R.p))==k?'on':''}"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICO[k]}</svg>${k=='chat'&&Object.values(U.chats).some(c=>c.un)?'<i class="dotb"></i>':''}</button>`).join('')}</div>`;
const back=(to='home')=>`<button class="rb" data-a="go" data-v="${to}">‹</button>`;
