<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><title>CHAI</title>
<style>
:root{--bg:#171717;--c:#262626;--c2:#2e2e2e;--m:#9a9a9a;--r:#ff4d5a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#171717;color:#fff;font:15px Montserrat,system-ui,sans-serif}
#app{max-width:480px;height:100%;margin:auto;position:relative;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top)}
.scr{flex:1;overflow-y:auto;padding:12px 16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:#fff;background:var(--c);border:0;border-radius:14px;padding:14px;width:100%;outline:0}
textarea{resize:none}
h2{text-align:center;font-weight:500;font-size:17px;padding:12px 0}
.nav{display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid #222}
.nav button{opacity:.55;padding:6px 18px}.nav .on{opacity:1}
.nav svg,.ic svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin:0 -16px}
.card{position:relative;aspect-ratio:1;overflow:hidden;text-align:left;width:100%}
.card img,.ph{width:100%;height:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:600}
.card b{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;font-weight:500;font-size:13.5px;background:linear-gradient(transparent,#000c)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:10px 0 14px}
.chip{border:1px solid #333;background:#000;border-radius:22px;padding:10px 18px;white-space:nowrap}.chip.on{background:#fff;color:#000}
.search{display:flex;gap:10px;align-items:center;background:var(--c);border-radius:30px;padding:0 16px;margin:6px 0}.search input{background:none;padding:14px 0}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.rb{width:46px;height:46px;border-radius:50%;background:var(--c2);display:flex;align-items:center;justify-content:center;font-size:20px}
.pill{background:var(--c2);border-radius:24px;padding:12px 20px}
.cta{display:block;width:calc(100% - 32px);margin:10px 16px;background:#fff;color:#000;border-radius:30px;padding:18px;font-size:17px;text-align:center}
.hero{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1}.hero .ph,.hero img{height:100%}
.hero h3{position:absolute;left:16px;bottom:16px;font-size:22px;font-weight:500;text-shadow:0 1px 8px #000}
.note{font-style:italic;color:var(--m);text-align:center;font-size:12.5px;margin:12px 0}
.msgs{flex:1;overflow-y:auto;padding:12px 14px}
.m{display:flex;gap:10px;margin:16px 0}.m .av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;background:var(--c2)}.m .av .ph,.m .av img{font-size:20px}
.m p{white-space:pre-wrap;line-height:1.5;font-size:15px;flex:1}.m.u{justify-content:flex-end}.m.u p{flex:none;max-width:82%;background:var(--c2);padding:12px 16px;border-radius:20px}
.bar{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));align-items:flex-end}
.bar textarea{border-radius:28px;padding:15px 20px;max-height:140px}
.pbox{background:var(--c);border-radius:22px;padding:18px;margin:16px 14px;position:relative}
.row{display:flex;align-items:center;gap:16px;padding:16px 4px;border-bottom:1px solid #222;text-align:left;width:100%}
.drawer{position:absolute;inset:0;z-index:5;display:flex}.drawer i{flex:1;background:#0008}.drawer div{width:68%;background:#1b1b1b;padding:20px 0;padding-top:calc(20px + env(safe-area-inset-top))}
.drawer button{display:block;width:100%;text-align:left;padding:20px 24px;font-size:16px;border-bottom:1px solid #2a2a2a}
.auth{background:#000;flex:1;padding:40px 24px;display:flex;flex-direction:column;gap:14px}
.auth .big{font-size:34px;margin:20px 0 auto;letter-spacing:1px}.auth input{background:#1a1a1a}
.wb{background:#fff;color:#000;border-radius:30px;padding:16px;font-size:16px}.wb.g{background:#1a1a1a;color:#fff}
.sw{width:52px;height:30px;border-radius:15px;background:#555;position:relative;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#ccc;transition:.2s}.sw.on{background:#8a2a33}.sw.on::after{left:25px;background:var(--r)}
.lb{color:#8ab4ff;font-size:14px;margin:22px 0 4px}.sub{color:var(--m);font-size:13px;line-height:1.4}
.err{color:var(--r);font-size:14px}.dots{opacity:.6;animation:b 1s infinite}@keyframes b{50%{opacity:.2}}
.ov{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#000a}
.dl{width:86%;max-width:400px;background:#2c2c2c;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}.dl b{font-weight:500;font-size:18px;white-space:pre-wrap}
.da{display:flex;justify-content:flex-end;gap:24px}.da button{color:var(--r);padding:8px;font-size:17px}
.tl{display:flex;gap:2px;opacity:.55;margin-top:2px}.tl button{padding:4px 8px;font-size:15px}.m.u .tl{justify-content:flex-end}
.m.u .w{max-width:84%;text-align:right}.m.u .w p{max-width:100%;display:inline-block;text-align:left}.m .w{flex:1;min-width:0}
.pi{width:100%;height:100%;object-fit:cover;display:block}.act{font-style:italic;color:#aab4d4;font-size:14px}.sc{font-size:12px;align-self:center;padding:0 4px}
.pen{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:#171717e6;display:flex;align-items:center;justify-content:center;font-size:18px}
input,textarea,select{font-size:14px}
.sh{position:absolute;inset:0;z-index:7;background:#0000;transition:background .28s}.sh.on{background:#000a}
.sh>div{position:absolute;left:0;right:0;bottom:0;background:#1b1b1b;border-radius:24px 24px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s ease}.sh.on>div{transform:none}
.hv{position:absolute;left:0;right:0;bottom:0;padding:50px 14px 14px;background:linear-gradient(transparent,#000d)}.hv .r{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:500}
.ap{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;background:#ffffff24;border-radius:30px;padding:7px 16px 7px 7px;text-align:left;font-size:15px}.ap .a{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;display:block}.ap .a .ph{font-size:18px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#e5394a;margin-right:6px}.dot.g{background:#3ddc84}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const DEFAULT_KEY='',DEFAULT_MODEL='openrouter/free',DEFAULT_URL='https://openrouter.ai/api/v1'; // вставь свой ключ в DEFAULT_KEY между кавычками
const FIREBASE_CONFIG={apiKey:"AIzaSyDbhC4ev2vO-uQjD5jhpZLsU_C4hr8kvNk",authDomain:"chai-app-ffc6c.firebaseapp.com",projectId:"chai-app-ffc6c",storageBucket:"chai-app-ffc6c.firebasestorage.app",messagingSenderId:"225344073889",appId:"1:225344073889:web:692dfc6a135697372a00e0",measurementId:"G-J867NSX2K5"}; // для облака и входа через Google: вставь сюда объект firebaseConfig из консоли Firebase
let FB=null,PUB=[],AUTH={};
const NETERR='Нет связи с нейросетью (Failed to fetch). Нажми Профиль → Settings → «Проверить связь». Частые причины: нет интернета или VPN режет openrouter.ai; либо файл открыт в просмотрщике внутри другого приложения (там сеть закрыта): открой его в Chrome или собери APK.';
const F=(u,o)=>fetch(u,o).catch(()=>{throw new Error(NETERR)});
let DB=JSON.parse(localStorage.getItem('chai_db')||'null')||{users:{},cur:null};
const save=()=>{try{localStorage.setItem('chai_db',JSON.stringify(DB))}catch(e){dlg('Память браузера заполнена: удали старые чаты или ботов')}cpush()};
Object.values(DB.users).forEach(u=>Object.entries(u.chats).forEach(([k,c])=>{if(!c.id){c.id=k;c.bot=k;c.t=0}}));
const applyDef=()=>{if(!U)return;const s=U.s;if(!s.key&&DEFAULT_KEY)s.key=DEFAULT_KEY;if(!s.model&&DEFAULT_MODEL)s.model=DEFAULT_MODEL;if(!s.url)s.url=DEFAULT_URL;save()};
let U=DB.cur&&DB.users[DB.cur],R={p:'home'},busy=false,err='',menu=false,q='',flt='';
const SEED=[
{id:'s1',name:'Grey (Sometimes-Cat Roommate)',tag:'Friends',g:'m',desc:'Grey, 24. Quiet, warm roommate who turns into a cat when stressed. Dry humor, secretly clingy.',first:'*Серый кот лениво поднимает голову с дивана* Ты вернулся(лась)... Я не ждал. Совсем. *хвост предательски виляет*'},
{id:'s2',name:'Yuzuki (Teasing Tomboy Roommate)',tag:'Friends',g:'f',desc:'Yuzuki, 22. Teasing, sporty roommate who hides shyness behind jokes.',first:'*не отрываясь от книги* О, живой. А я уж думала, ты решил съехать, {{user}}.'},
{id:'s3',name:'Mafia Heir Rocco',tag:'Mafia',g:'m',desc:'Rocco, 28. Heir of a mafia family. Cold, controlled, fiercely loyal to few.',first:'*бокал замирает в его руке* Ты опоздал(а), {{user}}. Сядь. Нам нужно поговорить.'},
{id:'s4',name:'Theodric (Wounded King)',tag:'Royalty',g:'m',desc:'Theodric, 30. Exiled wounded king in a ruined kingdom. Proud, haunted, slowly trusting.',first:'*он поднимает взгляд, рука сжимает повязку* Ты нашёл(ла) меня. Тогда слушай внимательно.'}];
const ICO={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/>',plus:'<circle cx="12" cy="12" r="10"/><path d="M12 7v10M7 12h10"/>',chat:'<path d="M3 4h18v13H9l-5 4v-4H3z"/>',me:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M6 19c2-4 10-4 12 0"/>'};
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
const pic=(b,c='')=>b.img?`<img src="${b.img}" class="pi">`:`<div class="ph" style="background:hsl(${hue(b.name||'?')},35%,28%)">${esc((b.name||'?')[0])}</div>`;
const allBots=()=>SEED.concat(U.bots,PUB.filter(p=>!U.bots.some(b=>b.id==p.id))).filter(b=>!U.blocked.includes(b.id)&&(U.s.nsfw||!b.nsfw));
const bot=id=>SEED.concat(U.bots,PUB).find(b=>b.id==id);
const chatOf=id=>U.chats[id];
const chatsOf=bid=>Object.values(U.chats).filter(c=>c.bot==bid).sort((a,b)=>b.t-a.t);
const newChat=(bid,from)=>{const id=uid();U.chats[id]={id,bot:bid,t:Date.now(),msgs:[],sum:'',sumN:0,persona:from?from.persona:null,mem:from?from.mem:''};bump(bid);return id};
const persona=c=>U.personas.find(p=>p.id==c.persona);
const uname=c=>(persona(c)||{}).name||U.name;
const fill=(t,c,b)=>t.replace(/\{\{user\}\}/g,uname(c)).replace(/\{\{char\}\}/g,b.name);
async function hash(p,s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const go=(p,v)=>{R={p,v};menu=false;render()};
const nav=()=>`<div class="nav">${['home','search','plus','chat','me'].map(k=>`<button data-a="tab" data-v="${k}" class="${(R.tab||({chats:'chat',create:'plus'}[R.p]||R.p))==k?'on':''}"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICO[k]}</svg></button>`).join('')}</div>`;
const back=(to='home')=>`<button class="rb" data-a="go" data-v="${to}">‹</button>`;
const grid=l=>l.length?`<div class="grid">${l.map(b=>`<button class="card" data-a="bot" data-v="${b.id}">${pic(b)}<b>${esc(b.name)}</b></button>`).join('')}</div>`:'<p class="note">Ничего не найдено</p>';

const V={
auth(){return`<div class="auth"><div style="display:flex;gap:10px;align-items:center;font-size:26px;font-weight:600"><svg width="46" height="30" viewBox="0 0 46 30"><rect x="14" width="32" height="14" rx="7" fill="#fff"/><rect x="0" y="9" width="24" height="12" rx="6" fill="#fff"/><rect x="14" y="17" width="32" height="13" rx="6.5" fill="#fff"/></svg>CHAI</div>
<div class="big">CHAT + AI</div><div class="err">${esc(err)}</div>
${FB?'<div id="gbtn" style="display:flex;justify-content:center;min-height:44px"></div><button class="wb" data-a="fbk">Sign in with Facebook</button>':''}<input id="lu" placeholder="${FB?'Email':'Имя пользователя'}" autocapitalize="off"><input id="lp" type="password" placeholder="Пароль (от 6 символов)">
<button class="wb" data-a="login">Войти</button><button class="wb g" data-a="signup">Создать аккаунт</button></div>`},
home(){const l=allBots();return`<div class="scr"><div class="search" data-a="tab" data-v="search"><span>⌕</span><input placeholder="Search anything…" readonly></div>${grid(l)}</div>${nav()}`},
search(){let l=allBots().filter(b=>(!q||(b.name+b.desc+b.tag).toLowerCase().includes(q.toLowerCase()))&&(!flt||b.g==flt||b.tag==flt));
return`<div class="scr"><div class="search"><span>⌕</span><input id="q" placeholder="Search for bots…" value="${esc(q)}"></div><p class="sub" style="margin:10px 0">🛡 You're speaking to AI. Anything they say may or may not be factual.</p>
<div style="display:flex;justify-content:flex-end"><button class="pill" data-a="nsfw">${U.s.nsfw?'NSFW ON':'Safe Search ON'}</button></div>
<div class="chips">${[['m','♂'],['f','♀'],['Friends','Friends'],['Royalty','Royalty'],['Mafia','Mafia']].map(([k,t])=>`<button class="chip ${flt==k?'on':''}" data-a="flt" data-v="${k}">${t}</button>`).join('')}</div>${grid(l)}</div>${nav()}`},
bot(){const b=bot(R.v),l=chatsOf(b.id).filter(x=>x.msgs.length),c=chatsOf(b.id)[0]||{},own=U.bots.some(x=>x.id==b.id)&&!b.ext;
return`<div class="top"><button class="rb" data-a="prev">‹</button><b style="font-size:20px">CHAI</b><span style="width:46px"></span></div><div class="scr" style="padding-top:0">${heroCard(b)}
<p class="note">Персонаж создан пользователем. Все персонажи — взрослые (18+).</p>
<h2 style="text-align:left;padding:8px 0">First Message</h2><p style="line-height:1.5;white-space:pre-wrap">${fmt(fill(b.first,c,b))}</p>
<p class="sub" style="margin:18px 0">${esc(b.desc)}</p>${own?`<button class="pill" data-a="edit" data-v="${b.id}">Редактировать бота</button> <button class="pill" data-a="delbot" data-v="${b.id}">Удалить</button>${(b.vis=='share'||b.vis=='public')?` <button class="pill" data-a="sharebot" data-v="${b.id}">Поделиться</button>`:''}`:''}</div><button class="cta" data-a="startbot" data-v="${b.id}">${l.length?'Continue chat':'Start Chatting'}</button>${l.length?`<button class="cta" style="background:#2e2e2e;color:#fff;margin-top:0" data-a="newchat" data-v="${b.id}">New chat (старые сохранятся: ${l.length})</button>`:''}`},
chat(){const c=chatOf(R.v),b=bot(c.bot);
return`<div class="top">${back(R.from||'home')}<b style="font-size:20px">CHAI</b><button class="rb" data-a="menu">☰</button></div>
<div style="padding:0 14px"><button class="pill" data-a="info" data-v="${b.id}" style="display:flex;gap:12px;align-items:center;padding:10px 14px;width:100%;text-align:left"><span class="av" style="width:38px;height:38px;border-radius:50%;overflow:hidden;display:block">${pic(b)}</span>${esc(b.name)}</button></div>
<div class="msgs" id="msgs">${msgsHtml(b,c)}</div><div class="err" style="padding:0 16px">${esc(err)}</div>
<div class="bar"><textarea id="inp" rows="1" placeholder="Type a message"></textarea><button class="rb" style="width:54px;height:54px;background:#fff;color:#000" data-a="send">➤</button></div>
${menu?`<div class="drawer"><i data-a="menu"></i><div><button data-a="newchat" data-v="${b.id}">New chat</button><button data-a="oldchats">Old chats</button><button data-a="mem">Memory</button><button data-a="persona">Persona</button>${U.bots.some(x=>x.id==b.id)?`<button data-a="edit" data-v="${b.id}">Edit bot</button>`:''}<button data-a="clear">Clear chat</button><button data-a="share">Share</button><button data-a="block">Block</button></div></div>`:''}`},
chats(){const l=Object.values(U.chats).filter(c=>bot(c.bot)&&c.msgs.length&&(!R.f||c.bot==R.f)).sort((a,b)=>b.t-a.t);
return`<div class="scr"><h2>CHATS</h2><p class="note" style="margin-top:0">${R.f?'Чаты с '+esc(bot(R.f).name):'Чаты хранятся в аккаунте без ограничений по времени'}</p><div style="text-align:right"><button class="pill" data-a="delall">Delete all chats</button></div>
${l.length?'':'<p class="note">Пока нет чатов</p>'}${l.map(c=>{const b=bot(c.bot),d=c.t?new Date(c.t).toLocaleDateString():'';return`<div class="row"><button style="display:flex;gap:16px;align-items:center;flex:1;text-align:left" data-a="chat" data-v="${c.id}"><span style="width:54px;height:54px;border-radius:50%;overflow:hidden;display:block;flex:none">${pic(b)}</span><span>${esc(b.name)}<br><span class="sub">${d} · ${c.msgs.length} сообщ.<br>${esc(c.msgs.slice(-1)[0].t.slice(0,40))}</span></span></button><button data-a="delchat" data-v="${c.id}">🗑</button></div>`}).join('')}</div>${nav()}`},
create(){const b=R.v?bot(R.v):{};
return`<div class="scr"><h2>${b.id?'Редактировать бота':'Создать бота'}</h2>${b.id?'':'<button class="pill" style="width:100%;margin-bottom:12px" data-a="import">Импорт бота по коду от друга</button>'}<div style="display:flex;flex-direction:column;gap:12px">
<button class="hero" style="width:50%;margin:auto" data-a="pick">${b.img?`<img class="pi" src="${b.img}">`:'<div style="width:100%;height:100%;background:linear-gradient(135deg,#fb2c3c,#ff6b61)"><svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="37" r="17" fill="#ffd9dc"/><ellipse cx="50" cy="80" rx="28" ry="17" fill="#ffd9dc"/></svg></div>'}<span class="pen">✎</span></button><input type="file" id="file" accept="image/*" hidden>
<input id="bn" placeholder="Имя" value="${esc(b.name)}"><textarea id="bd" rows="5" placeholder="Описание и характер (кто он/она, как говорит, возраст 18+)">${esc(b.desc)}</textarea>
<textarea id="bf" rows="4" placeholder="Первое сообщение. Можно {{user}} и {{char}}">${esc(b.first)}</textarea>
<select id="bg"><option value="">Пол: любой</option><option value="m" ${b.g=='m'?'selected':''}>♂</option><option value="f" ${b.g=='f'?'selected':''}>♀</option></select><input id="bt" placeholder="Категория (Friends, Royalty, Mafia…)" value="${esc(b.tag)}">
<div class="row" style="border:0"><span style="flex:1">NSFW бот</span><button class="sw ${b.nsfw?'on':''}" id="bs" data-a="tgl"></button></div><select id="bv"><option value="private">Видимость: только мне</option><option value="share" ${b.vis=='share'?'selected':''}>Видимость: можно делиться кодом</option>${FB?`<option value="public" ${b.vis=='public'?'selected':''}>Видимость: открытый (виден всем в сети)</option>`:''}</select><button class="wb" data-a="savebot" data-v="${b.id||''}">Сохранить</button></div></div>${nav()}`},
me(){return`<div class="scr"><h2>PROFILE</h2><div class="hero" style="width:60%;margin:auto;border-radius:50%">${pic({name:U.name,img:U.img})}</div>
<div class="row" style="margin-top:24px"><span>👤</span><span style="flex:1"><span class="sub">Name</span><br>${esc(U.name)}</span><button data-a="rename">✎</button></div>
<button class="row" data-a="go" data-v="memory">📇<span style="flex:1">Personas</span>›</button><button class="row" data-a="go" data-v="settings">⚙<span style="flex:1">Settings</span>›</button></div>${nav()}`},
